<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>HomeworkCheck – เช็คส่งการบ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --pri:#4f46e5; --pri2:#6d5dfc; --bg:#f3f4fb; --card:#fff; --line:#e6e8f2; --text:#1f2333; --mut:#6b7086;
  --g:#16a34a; --gbg:#dcfce7; --y:#d97706; --ybg:#fef3c7; --b:#0284c7; --bbg:#e0f2fe; --r:#dc2626; --rbg:#fee2e2; --n:#6b7280; --nbg:#f1f2f6;
  --rad:14px; --sh:0 1px 3px rgba(30,35,80,.06),0 4px 14px rgba(30,35,80,.04);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
/* header */
header{background:linear-gradient(90deg,#4338ca,#5b52f0 55%,#6d63ff);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(67,56,202,.25)}
.hwrap{max-width:1100px;margin:auto;padding:10px 20px 0}
.htop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px}
.logo i{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center;font-style:normal;font-size:17px}
.logo small{font-weight:500;font-size:14px;opacity:.9;margin-left:4px}
.hright{margin-left:auto;display:flex;gap:8px;align-items:center}
.pillw{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.hsel{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:10px;padding:7px 10px;font-weight:700;outline:none}
.hsel option{color:#222}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:#e9e8ff;padding:10px 16px;border-radius:12px 12px 0 0;font-weight:700;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.1)}
nav button.on{background:var(--bg);color:var(--pri)}
main{max-width:1100px;margin:auto;padding:18px 20px 60px}
/* generic */
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#c7c9de;background:#fafaff}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.g{background:var(--g);border-color:var(--g);color:#fff}
.btn.line{background:#06c755;border-color:#06c755;color:#fff}
.btn.xl{background:#107c41;border-color:#107c41;color:#fff}
.btn.danger{color:var(--r);border-color:#f5c2c2}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input.f,select.f,textarea.f{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:none;width:100%}
input.f:focus,select.f:focus,textarea.f:focus{border-color:#a5a0ff;box-shadow:0 0 0 3px rgba(99,91,255,.12)}
label.l{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
.mut{color:var(--mut)} .sm{font-size:13px}
h2{margin:0;font-size:19px} h3{margin:0 0 10px;font-size:16px}
.grid{display:grid;gap:10px}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.empty .ico{font-size:42px}
/* pills */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;color:#4b4f6b}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.3)}
.pill.add{border-style:dashed;color:var(--pri)}
/* check head */
.chead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.meta{font-size:13px;color:var(--mut);margin-top:4px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.badge.r{background:var(--rbg);color:var(--r)} .badge.g{background:var(--gbg);color:var(--g)} .badge.y{background:var(--ybg);color:var(--y)}
.apick{display:flex;gap:6px;align-items:flex-start}
.apick select{min-width:220px;max-width:320px}
.note{display:flex;align-items:center;gap:10px;background:#fffbea;border:1px solid #fbe7a1;border-radius:10px;padding:4px 14px;margin:14px 0}
.note input{border:0;background:transparent;outline:none;flex:1;padding:8px 0}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stat{border-radius:12px;padding:12px 6px;text-align:center;border:2px solid transparent;cursor:pointer;transition:.15s;user-select:none}
.stat:hover{transform:translateY(-1px)}
.stat.sel{border-color:currentColor}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{font-size:13px;font-weight:700}
.c-g{background:var(--gbg);color:var(--g)} .c-y{background:var(--ybg);color:var(--y)} .c-b{background:var(--bbg);color:var(--b)} .c-r{background:var(--rbg);color:var(--r)} .c-n{background:var(--nbg);color:var(--n)}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:12px 0 6px}
.bar{height:8px;background:#eceef5;border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .3s}
/* toolbar */
.tool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px}
.search{flex:1;min-width:180px;position:relative}
.search input{padding-left:36px}
.search:before{content:'🔍';position:absolute;left:11px;top:9px;font-size:14px}
/* rows */
.row{background:#fff;border-radius:12px;box-shadow:var(--sh);display:grid;grid-template-columns:36px 1fr auto 300px;align-items:center;gap:12px;padding:12px 16px;margin-bottom:10px;border-left:4px solid #d9dbe6}
.row.s-sent{border-left-color:var(--g)} .row.s-late{border-left-color:var(--y)} .row.s-excused{border-left-color:var(--b)} .row.s-missing{border-left-color:var(--r)}
.no{width:32px;height:32px;border-radius:50%;background:#eef0ff;color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px}
.who b{display:block;font-size:15px}
.who small{color:var(--mut);font-size:12px}
.sb{display:flex;gap:6px}
.sb button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:700;color:#555a72;min-width:56px}
.sb button:hover{background:#f7f7fb}
.sb button.on.sent{background:var(--g);border-color:var(--g);color:#fff}
.sb button.on.late{background:#f59e0b;border-color:#f59e0b;color:#fff}
.sb button.on.excused{background:var(--b);border-color:var(--b);color:#fff}
.sb button.on.missing{background:var(--r);border-color:var(--r);color:#fff}
.row input.f{padding:9px 12px}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f7f7fc;font-weight:700;color:#4b4f6b;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.mx{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font-weight:800;font-size:13px}
.mx.sent{background:var(--gbg);color:var(--g)} .mx.late{background:var(--ybg);color:var(--y)} .mx.excused{background:var(--bbg);color:var(--b)} .mx.missing{background:var(--rbg);color:var(--r)} .mx.none{background:var(--nbg);color:#aaa}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:var(--rad);box-shadow:var(--sh);padding:16px}
.kpi span{color:var(--mut);font-size:13px;font-weight:600}
.kpi b{display:block;font-size:28px;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hb{margin-bottom:12px}
.hb .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.lst{list-style:none;padding:0;margin:0}
.lst li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.lst li:last-child{border:0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,22,45,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fd .15s}
.md{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.md.wide{max-width:760px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.mh h3{margin:0}
.mh button{border:0;background:none;font-size:22px;color:var(--mut)}
.mb{padding:4px 18px 18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
@keyframes fd{from{opacity:0}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#22253a;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#qr-reader{width:100%;border-radius:12px;overflow:hidden;background:#111;min-height:60px}
#qr-reader video{border-radius:12px}
.scanlog{max-height:180px;overflow:auto;margin-top:10px}
.scanlog div{padding:7px 10px;border-radius:8px;margin-bottom:5px;font-size:14px}
.qrbox{display:grid;place-items:center;padding:10px}
.qrbox svg{width:200px;height:200px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.drop{border:2px dashed #c9c6ff;border-radius:12px;padding:22px;text-align:center;background:#f8f7ff;cursor:pointer}
.drop:hover{background:#f0eeff}
@media (max-width:860px){
  .row{grid-template-columns:32px 1fr;}
  .row .sb,.row input.f{grid-column:1/-1}
  .sb button{flex:1}
  .stats{grid-template-columns:repeat(3,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .logo small{display:none}
}
@media print{
  header,.noprint,.tool,#toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card{box-shadow:none;padding:0}
  .tw{border:0;overflow:visible}
  th{position:static}
}
.printonly{display:none}
.autoclose{margin:2px 0 8px;font-weight:600;flex-wrap:wrap}
.scanbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px}
.scanbar .btn{padding:12px 28px;font-size:16px}
@media (max-width:700px){.scanbar .btn{flex:1;justify-content:center;padding:14px}.scanbar span{flex:0 0 auto}#qr-reader video{max-height:46vh;object-fit:cover}}

/* ---------- desktop defaults for new markup ---------- */
.addgrid{grid-template-columns:80px 130px 110px 1fr 1fr auto;align-items:end}
.repsel{width:auto;min-width:180px}
.sp{flex:1}
.repbtns{display:flex;gap:8px;flex-wrap:wrap}
nav button i{font-style:normal;margin-right:5px} nav button b{display:none}
#fab{display:none}
/* ---------- MOBILE ---------- */
@media (max-width:700px){
  body{font-size:14.5px;padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
  input.f,select.f,textarea.f{font-size:16px} /* prevent iOS zoom */
  header{position:sticky}
  .hwrap{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  .htop{flex-wrap:nowrap;gap:8px}
  .logo{font-size:16px;gap:6px;min-width:0}
  .logo i{width:26px;height:26px;font-size:14px;flex:0 0 auto}
  body.can-scan[data-tab=check] main{padding-bottom:96px}
  .hright{gap:6px;min-width:0}
  html,body{overflow-x:clip}
  .logo{flex:1 1 auto;overflow:hidden;white-space:nowrap}
  .hright{flex:0 1 auto}
  .pillw{font-size:11px;padding:4px 8px;white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
  .hsel{max-width:104px;padding:6px 4px;font-size:14px}
  /* bottom tab bar */
  nav{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:40;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(30,35,80,.08);padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:0;overflow:visible}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:10px;color:#7a7f99;font-size:11px;min-width:0}
  nav button i{margin:0;font-size:19px;line-height:1.2;filter:grayscale(.6);opacity:.75}
  nav button span{display:none} nav button b{display:block;font-weight:700}
  nav button.on{background:#eef0ff;color:var(--pri)}
  nav button.on i{filter:none;opacity:1}
  nav button:hover{background:#f5f5fb}
  main{padding:12px 10px 20px}
  .card{padding:13px;border-radius:13px;margin-bottom:10px}
  h2{font-size:17px}
  /* subject pills scroll */
  .pills{flex-wrap:nowrap;overflow-x:auto;margin:0 -10px 10px;padding:2px 10px 4px;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;padding:7px 14px}
  /* check header */
  .chead{flex-direction:column;gap:10px}
  .apick{width:100%}
  .apick select{flex:1;min-width:0;max-width:none}
  .apick .btn{padding:9px 11px}
  .note{margin:10px 0;padding:2px 12px}
  .stats{grid-template-columns:repeat(5,1fr);gap:5px}
  .stat{padding:8px 2px;border-radius:10px}
  .stat b{font-size:20px}
  .stat span{font-size:10.5px;white-space:nowrap}
  /* toolbar */
  .tool{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;position:sticky;top:52px;z-index:10}
  .tool .search{grid-column:1/-1;order:-1;min-width:0}
  .tool .btn{justify-content:center;padding:8px 4px;font-size:12.5px;flex-direction:column;gap:0;line-height:1.3;white-space:normal;text-align:center}
  .tool .scanbtn{display:none}
  /* rows */
  .row{grid-template-columns:30px 1fr;gap:8px 10px;padding:11px 12px;margin-bottom:8px}
  .no{width:28px;height:28px;font-size:12px}
  .who b{font-size:14.5px}
  .sb{gap:5px}
  .sb button{flex:1;min-width:0;padding:10px 0;font-size:13.5px}
  .row input.f{padding:8px 11px}
  /* FAB */
  body.can-scan[data-tab=check] #fab{display:flex}
  #fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:39;width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(135deg,#4f46e5,#7c6bff);color:#fff;font-size:24px;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(79,70,229,.45);line-height:1}
  #fab span{font-size:10.5px;font-weight:700;margin-top:2px}
  #fab:active{transform:scale(.94)}
  #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
  /* modal as bottom sheet */
  .ov{align-items:end;padding:0}
  .md,.md.wide{max-width:none;border-radius:18px 18px 0 0;max-height:92vh;animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom)}
  .md:before{content:'';display:block;width:40px;height:4px;border-radius:9px;background:#d6d8e4;margin:8px auto 0}
  .mh{padding:10px 16px 12px}
  .mb{padding:4px 16px 14px}
  .mf{flex-wrap:wrap;padding:10px 16px 14px}
  .mf .btn{flex:1 1 40%;justify-content:center;padding:12px 10px}
  /* students */
  .addgrid{grid-template-columns:1fr 1fr}
  .addgrid>div:last-child{grid-column:1/-1}
  .addgrid>div:last-child .btn{width:100%;justify-content:center;padding:11px}
  .drop{padding:16px 12px;font-size:13.5px}
  /* report */
  .filt{gap:8px}
  .filt>b{display:none}
  .repsel{width:100%;min-width:0}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:9px 2px;font-size:13px;white-space:nowrap}
  .daterange{width:100%;display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center}
  .daterange input{width:100%!important;min-width:0}
  .sp{display:none}
  .repbtns{display:grid;grid-template-columns:repeat(3,1fr);width:100%;gap:6px}
  .repbtns .btn{justify-content:center;padding:9px 4px;font-size:12.5px;white-space:normal;text-align:center}
  /* tables */
  table{font-size:13px} th,td{padding:7px 8px}
  .tw{margin:0 -2px}
  .mx{width:24px;height:24px;font-size:12px}
  /* dashboard */
  .kpis{gap:8px;margin-bottom:10px}
  .kpi{padding:12px}
  .kpi b{font-size:24px}
  /* sheets / settings */
  .info{grid-template-columns:105px 1fr}
  .grid[style*="1fr 1fr"]{grid-template-columns:1fr!important}
  pre.code{font-size:11px}
  .acc summary{padding:12px 13px;font-size:13.5px}
  .acc .ab{padding:10px 13px}
  .lst li{flex-wrap:wrap}
}
@media (max-width:360px){
  .logo{font-size:15px}
  .stat span{font-size:9.5px}
  nav button b{font-size:10px}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media print{nav,#fab{display:none!important}body{padding:0}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 14px;font-weight:700;color:#555a72;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pri);color:#fff}
.filt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filt input[type=date]{width:auto}
.info{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px;margin:6px 0 12px}
.info span:nth-child(odd){color:var(--mut)}
.warn{background:#fff7e6;border:1px solid #fcd9a0;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.7;margin:10px 0}
.tip{background:#eef4ff;border:1px solid #c9dafc;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.7;margin:10px 0}
pre.code{background:#1e1f2e;color:#d6d8f0;border-radius:10px;padding:14px;font-size:12px;max-height:260px;overflow:auto;margin:8px 0;font-family:ui-monospace,Consolas,monospace;line-height:1.5}
ol.steps{padding-left:22px;line-height:1.9;font-size:14px}
ol.steps li{margin-bottom:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.acc details{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
.acc summary{padding:13px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:after{content:'▾';color:var(--mut);transition:.2s}
.acc details[open] summary:after{transform:rotate(180deg)}
.acc details[open] summary{background:#f7f7fc;border-bottom:1px solid var(--line)}
.acc .ab{padding:12px 16px;font-size:14px;line-height:1.8}
.acc .ab ol,.acc .ab ul{padding-left:22px;margin:6px 0}
.acc .ab table{font-size:13px}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:6px 0}
@media print{.printonly{display:block}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="htop">
      <div class="logo"><i>✓</i>HomeworkCheck <small>เช็คส่งการบ้าน</small></div>
      <div class="hright">
        <span class="pillw" id="saveInd">💾 บันทึกแล้ว</span>
        <select class="hsel" id="classSel"></select>
      </div>
    </div>
    <nav id="nav">
      <button data-t="check" class="on"><i>📋</i><span>เช็คการบ้าน</span><b>เช็ค</b></button>
      <button data-t="dash"><i>📈</i><span>แดชบอร์ด</span><b>ภาพรวม</b></button>
      <button data-t="students"><i>👥</i><span>นักเรียน</span><b>นักเรียน</b></button>
      <button data-t="report"><i>📊</i><span>รายงาน</span><b>รายงาน</b></button>
      <button data-t="sheets"><i>☁️</i><span>Google Sheets</span><b>ชีต</b></button>
      <button data-t="settings"><i>⚙️</i><span>ตั้งค่า</span><b>ตั้งค่า</b></button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div id="toast"></div>
<button id="fab" onclick="openScanner()" aria-label="สแกน QR">📷<span>สแกน</span></button>
<input type="file" id="fileXl" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="fileJson" accept=".json" hidden>

<script>
/* ================== DATA ================== */
const KEY='homeworkcheck_v1';
const ST={
  sent:{label:'ส่งแล้ว',btn:'ส่ง',c:'g',sym:'✓',emo:'✅'},
  late:{label:'ส่งช้า',btn:'ส่งช้า',c:'y',sym:'ช',emo:'⏰'},
  excused:{label:'ยกเว้น',btn:'ยกเว้น',c:'b',sym:'ย',emo:'🟦'},
  missing:{label:'ไม่ส่ง',btn:'ไม่ส่ง',c:'r',sym:'✗',emo:'❌'}
};
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function thDate(iso,long){if(!iso)return '-';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('th-TH',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short',year:'2-digit'})}
function thTime(ts){return new Date(ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}

function seed(){
  const names=[['ด.ช.','ภาคิน','วงศ์ดี'],['ด.ช.','พีรพล','มั่นคง'],['ด.ช.','วชิรวิทย์','พรหมมา'],['ด.ญ.','ณัฐธิดา','มีสุข'],['ด.ญ.','กมลชนก','ศรีสวัสดิ์'],['ด.ช.','ธนกฤต','ใจงาม'],['ด.ญ.','พิมพ์ชนก','บุญมา'],['ด.ญ.','ปุณยวีร์','แก้วใส']];
  const students=names.map((n,i)=>({id:uid(),no:i+1,code:String(31001+i),prefix:n[0],first:n[1],last:n[2]}));
  const a={id:uid(),title:'แบบฝึกหัดบทที่ 1',due:todayISO(),note:'',created:Date.now(),records:{}};
  const sub={id:uid(),name:'คณิตศาสตร์',code:'ค21101',teacher:'',assignments:[a]};
  const c={id:uid(),name:'ม.1/2',teacher:'',students,subjects:[sub]};
  return {settings:{school:''},classes:[c],cur:{classId:c.id,subjectId:sub.id,assignmentId:a.id}};
}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
let db=load()||seed();
let saveT;
function save(noSync){
  try{localStorage.setItem(KEY,JSON.stringify(db))}
  catch(e){$('#saveInd').textContent='⚠️ บันทึกไม่ได้';return}
  if(!noSync&&sync.connected){sync.pending=(sync.pending||0)+1;saveSync();scheduleSync()}
  updateInd();
}
function saveSoon(){$('#saveInd').textContent='⏳ กำลังบันทึก';clearTimeout(saveT);saveT=setTimeout(save,400)}

const cls=()=>db.classes.find(c=>c.id===db.cur.classId)||db.classes[0];
const subj=()=>{const c=cls();return c?(c.subjects.find(s=>s.id===db.cur.subjectId)||c.subjects[0]||null):null};
const asg=()=>{const s=subj();return s?(s.assignments.find(a=>a.id===db.cur.assignmentId)||s.assignments[s.assignments.length-1]||null):null};
const students=()=>(cls()?.students||[]).slice().sort((a,b)=>(a.no||0)-(b.no||0)||String(a.code).localeCompare(b.code));
const fullName=s=>`${s.prefix||''}${s.first||''} ${s.last||''}`.trim();

function counts(a,list){
  const r={sent:0,late:0,excused:0,missing:0,none:0};
  (list||students()).forEach(s=>{const x=a.records[s.id];r[x&&x.s?x.s:'none']++});
  return r;
}
function rate(c){const d=c.sent+c.late+c.missing+c.none;return d?Math.round((c.sent+c.late)/d*100):0}
const isOver=a=>a&&a.due&&todayISO()>a.due;

/* ================== UI HELPERS ================== */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function modal(title,body,buttons=[],wide){
  closeModal();
  const ov=document.createElement('div');ov.className='ov';ov.id='ov';
  ov.innerHTML=`<div class="md ${wide?'wide':''}"><div class="mh"><h3>${title}</h3><button data-x>×</button></div><div class="mb">${body}</div>${buttons.length?'<div class="mf"></div>':''}</div>`;
  const mf=ov.querySelector('.mf');
  buttons.forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.cls||'');e.innerHTML=b.label;e.onclick=()=>b.onClick?b.onClick(ov):closeModal();mf.appendChild(e)});
  ov.querySelector('[data-x]').onclick=closeModal;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});
  document.body.appendChild(ov);
  const f=ov.querySelector('input,select,textarea');if(f)setTimeout(()=>f.focus(),50);
  return ov;
}
let onModalClose=null;
function closeModal(){const o=$('#ov');if(o){o.remove();if(onModalClose){const f=onModalClose;onModalClose=null;f()}}}
function confirmBox(msg,fn,label='ยืนยัน'){modal('ยืนยัน',`<p>${msg}</p>`,[{label:'ยกเลิก'},{label,cls:'danger',onClick:()=>{closeModal();fn()}}])}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ================== HEADER / NAV ================== */
let tab='check',filter=null,query='';
function renderHeader(){
  const sel=$('#classSel');
  sel.innerHTML=db.classes.map(c=>`<option value="${c.id}" ${c.id===cls()?.id?'selected':''}>${esc(c.name)} (${c.students.length})</option>`).join('')+'<option value="__add">+ เพิ่มห้องเรียน</option>';
}
$('#classSel').onchange=e=>{
  if(e.target.value==='__add'){renderHeader();classModal();return}
  db.cur.classId=e.target.value;const s=cls().subjects[0];db.cur.subjectId=s?.id;db.cur.assignmentId=null;filter=null;save();render();
};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));render()};
function render(){
  renderHeader();
  document.body.dataset.tab=tab;
  ({check:renderCheck,dash:renderDash,students:renderStudents,report:renderReport,sheets:renderSheets,settings:renderSettings})[tab]();
}

/* ================== CHECK TAB ================== */
function renderCheck(){
  document.body.classList.remove('can-scan');
  const c=cls(),s=subj(),a=asg(),app=$('#app');
  if(!c){app.innerHTML=`<div class="card empty"><div class="ico">🏫</div><p>ยังไม่มีห้องเรียน</p><button class="btn pri" onclick="classModal()">+ เพิ่มห้องเรียน</button></div>`;return}
  let h=`<div class="pills">${c.subjects.map(x=>`<button class="pill ${x.id===s?.id?'on':''}" onclick="pickSubject('${x.id}')">📚 ${esc(x.name)}</button>`).join('')}<button class="pill add" onclick="subjectModal()">+ เพิ่มรายวิชา</button></div>`;
  if(!s){app.innerHTML=h+`<div class="card empty"><div class="ico">📚</div><p>ยังไม่มีรายวิชาในห้อง ${esc(c.name)}</p><button class="btn pri" onclick="subjectModal()">+ เพิ่มรายวิชา</button></div>`;return}
  if(!a){app.innerHTML=h+`<div class="card empty"><div class="ico">📝</div><p>วิชา ${esc(s.name)} ยังไม่มีงาน/การบ้าน</p><button class="btn pri" onclick="asgModal()">+ สร้างงานใหม่</button></div>`;return}
  if(!c.students.length){app.innerHTML=h+`<div class="card empty"><div class="ico">👥</div><p>ห้องนี้ยังไม่มีรายชื่อนักเรียน</p><button class="btn pri" onclick="tab='students';document.querySelector('[data-t=students]').click()">ไปเพิ่ม / นำเข้ารายชื่อ</button></div>`;return}
  const opts=s.assignments.slice().reverse().map(x=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${esc(x.title)} · ${thDate(x.due)}</option>`).join('');
  h+=`<div class="card">
    <div class="chead">
      <div>
        <h2>📝 ${esc(a.title)}</h2>
        <div class="meta">📚 ${esc(s.name)}${s.code?' ('+esc(s.code)+')':''} · ${esc(c.name)}${s.teacher?' · 👩‍🏫 ครูผู้สอน: '+esc(s.teacher):''}</div>
        <div class="meta">📅 กำหนดส่ง: ${thDate(a.due,true)} ${isOver(a)?'<span class="badge r">เลยกำหนด</span>':a.due===todayISO()?'<span class="badge y">ส่งวันนี้</span>':'<span class="badge g">ยังไม่ถึงกำหนด</span>'}</div>
      </div>
      <div class="apick">
        <select class="f" onchange="db.cur.assignmentId=this.value;filter=null;save();renderCheck()">${opts}</select>
        <button class="btn" title="แก้ไขงาน" onclick="asgModal('${a.id}')">✎</button>
        <button class="btn pri" onclick="asgModal()">+ งานใหม่</button>
      </div>
    </div>
    <div class="note">📝<input value="${esc(a.note)}" placeholder="รายละเอียดงาน (ไม่บังคับ) เช่น แบบฝึกหัดหน้า 25 ข้อ 1-10, ส่งในสมุด" oninput="asg().note=this.value;saveSoon()"></div>
    <div class="stats" id="stats"></div>
    <div class="prog"><span id="progT"></span><span id="progR"></span></div>
    <div class="bar" id="bar"></div>
  </div>
  <div class="card tool">
    <button class="btn g" onclick="markAll()">✓ <span>ส่งครบทุกคน</span></button>
    <button class="btn" onclick="clearAll()">↺ <span>ล้าง</span></button>
    <div class="search"><input class="f" id="q" type="search" placeholder="ค้นหาชื่อ / เลขประจำตัว" value="${esc(query)}"></div>
    <button class="btn pri scanbtn" onclick="openScanner()">📷 <span>สแกน QR</span></button>
    <button class="btn line" onclick="shareLine()">💬 <span>ส่ง LINE</span></button>
    <button class="btn xl" onclick="exportAsg()">⬇ <span>Excel</span></button>
  </div>
  <div id="list"></div>`;
  app.innerHTML=h;document.body.classList.add('can-scan');
  $('#q').oninput=e=>{query=e.target.value;renderList()};
  renderStats();renderList();
}
function pickSubject(id){db.cur.subjectId=id;db.cur.assignmentId=null;filter=null;save();renderCheck()}
function renderStats(){
  const a=asg();if(!a||!$('#stats'))return;
  const k=counts(a),N=students().length,checked=N-k.none;
  const items=[['sent','c-g','ส่งแล้ว'],['late','c-y','ส่งช้า'],['excused','c-b','ยกเว้น'],['missing','c-r','ไม่ส่ง'],['none','c-n','ยังไม่ตรวจ']];
  $('#stats').innerHTML=items.map(([key,c,l])=>`<div class="stat ${c} ${filter===key?'sel':''}" onclick="filter=filter==='${key}'?null:'${key}';renderStats();renderList()" title="คลิกเพื่อกรอง"><b>${k[key]}</b><span>${l}</span></div>`).join('');
  $('#progT').textContent=`ตรวจแล้ว ${checked} / ${N} คน`+(filter?` · กำลังกรอง: ${items.find(i=>i[0]===filter)[2]}`:'');
  $('#progR').innerHTML=checked===N?'<b style="color:var(--g)">✅ ตรวจครบแล้ว</b>':`อัตราการส่ง ${rate(k)}%`;
  $('#bar').innerHTML=N?['sent','late','excused','missing'].map(x=>`<i style="width:${k[x]/N*100}%;background:var(--${ST[x].c})"></i>`).join(''):'';
}
function renderList(){
  const a=asg(),q=query.trim().toLowerCase();
  let list=students().filter(s=>!q||fullName(s).toLowerCase().includes(q)||String(s.code).includes(q)||String(s.no)===q);
  if(filter)list=list.filter(s=>(a.records[s.id]?.s||'none')===filter);
  $('#list').innerHTML=list.length?list.map(rowHTML).join(''):'<div class="card empty">ไม่พบรายชื่อ</div>';
}
function rowHTML(s){
  const r=asg().records[s.id]||{};
  return `<div class="row ${r.s?'s-'+r.s:''}" id="r-${s.id}">
    <div class="no">${s.no||'-'}</div>
    <div class="who"><b>${esc(fullName(s))}</b><small>เลขประจำตัว ${esc(s.code)}${r.t&&(r.s==='sent'||r.s==='late')?' · ส่งเมื่อ '+thTime(r.t):''}</small></div>
    <div class="sb">${Object.keys(ST).map(k=>`<button class="${k} ${r.s===k?'on':''}" onclick="setSt('${s.id}','${k}')">${ST[k].btn}</button>`).join('')}</div>
    <input class="f" placeholder="เหตุผล / หมายเหตุ" value="${esc(r.r)}" oninput="setReason('${s.id}',this.value)">
  </div>`;
}
function setSt(sid,k,silent){
  const a=asg();const r=a.records[sid]||(a.records[sid]={});
  if(r.s===k&&!silent){delete r.s;delete r.t}else{r.s=k;r.t=Date.now()}
  if(!r.s&&!r.r)delete a.records[sid];
  save();
  const el=$('#r-'+sid);
  if(el){const s=cls().students.find(x=>x.id===sid);const tmp=document.createElement('div');tmp.innerHTML=rowHTML(s);el.replaceWith(tmp.firstElementChild)}
  renderStats();
}
function setReason(sid,v){const a=asg();const r=a.records[sid]||(a.records[sid]={});r.r=v;saveSoon()}
function markAll(){const a=asg();let n=0;students().forEach(s=>{const r=a.records[s.id]||(a.records[s.id]={});if(!r.s){r.s='sent';r.t=Date.now();n++}});save();renderCheck();toast(`บันทึก "ส่งแล้ว" ให้ ${n} คนที่ยังไม่ตรวจ`)}
function clearAll(){confirmBox('ล้างสถานะและเหตุผลของงานนี้ทั้งหมด?',()=>{asg().records={};save();renderCheck();toast('ล้างข้อมูลแล้ว')},'ล้าง')}

/* ---------- subject / assignment / class modals ---------- */
function subjectModal(id){
  const s=id?cls().subjects.find(x=>x.id===id):null;
  modal(s?'แก้ไขรายวิชา':'เพิ่มรายวิชา',`
    <label class="l">ชื่อวิชา *</label><input class="f" id="m1" value="${esc(s?.name)}" placeholder="เช่น ภาษาไทย, วิทยาศาสตร์">
    <label class="l">รหัสวิชา</label><input class="f" id="m2" value="${esc(s?.code)}" placeholder="เช่น ท21101">
    <label class="l">ครูผู้สอน</label><input class="f" id="m3" value="${esc(s?.teacher||db.settings.teacher||'')}" placeholder="ชื่อครูผู้สอน">`,
  [{label:'ยกเลิก'},{label:s?'บันทึก':'+ เพิ่มรายวิชา',cls:'pri',onClick:()=>{
    const name=$('#m1').value.trim();if(!name)return toast('กรุณากรอกชื่อวิชา');
    if(s){Object.assign(s,{name,code:$('#m2').value.trim(),teacher:$('#m3').value.trim()})}
    else{const n={id:uid(),name,code:$('#m2').value.trim(),teacher:$('#m3').value.trim(),assignments:[]};cls().subjects.push(n);db.cur.subjectId=n.id;db.cur.assignmentId=null}
    save();closeModal();render();toast('บันทึกรายวิชาแล้ว');
    if(!s)setTimeout(()=>asgModal(),200);
  }}]);
}
function asgModal(id){
  const a=id?subj().assignments.find(x=>x.id===id):null;
  modal(a?'แก้ไขงาน':`สร้างงานใหม่ · ${esc(subj().name)}`,`
    <label class="l">ชื่องาน / การบ้าน *</label><input class="f" id="m1" value="${esc(a?.title)}" placeholder="เช่น แบบฝึกหัดบทที่ 2, รายงานกลุ่ม">
    <label class="l">กำหนดส่ง</label><input class="f" type="date" id="m2" value="${a?.due||todayISO()}">
    <label class="l">รายละเอียด</label><textarea class="f" id="m3" rows="2" placeholder="ไม่บังคับ">${esc(a?.note)}</textarea>
    ${a?`<div style="margin-top:14px"><button class="btn sm danger" onclick="delAsg('${a.id}')">🗑 ลบงานนี้</button></div>`:''}`,
  [{label:'ยกเลิก'},{label:a?'บันทึก':'+ สร้างงาน',cls:'pri',onClick:()=>{
    const title=$('#m1').value.trim();if(!title)return toast('กรุณากรอกชื่องาน');
    if(a)Object.assign(a,{title,due:$('#m2').value,note:$('#m3').value});
    else{const n={id:uid(),title,due:$('#m2').value,note:$('#m3').value,created:Date.now(),records:{}};subj().assignments.push(n);db.cur.assignmentId=n.id}
    filter=null;save();closeModal();render();toast('บันทึกงานแล้ว');
  }}]);
}
function delAsg(id){confirmBox('ลบงานนี้และข้อมูลการส่งทั้งหมด?',()=>{const s=subj();s.assignments=s.assignments.filter(x=>x.id!==id);db.cur.assignmentId=null;save();render();toast('ลบงานแล้ว')},'ลบ')}
function classModal(id){
  const c=id?db.classes.find(x=>x.id===id):null;
  modal(c?'แก้ไขห้องเรียน':'เพิ่มห้องเรียน',`
    <label class="l">ชื่อห้อง *</label><input class="f" id="m1" value="${esc(c?.name)}" placeholder="เช่น ม.1/2">
    <label class="l">ครูประจำชั้น</label><input class="f" id="m2" value="${esc(c?.teacher)}">`,
  [{label:'ยกเลิก'},{label:'บันทึก',cls:'pri',onClick:()=>{
    const name=$('#m1').value.trim();if(!name)return toast('กรุณากรอกชื่อห้อง');
    if(c)Object.assign(c,{name,teacher:$('#m2').value.trim()});
    else{const n={id:uid(),name,teacher:$('#m2').value.trim(),students:[],subjects:[]};db.classes.push(n);db.cur.classId=n.id;db.cur.subjectId=null;db.cur.assignmentId=null}
    save();closeModal();render();toast('บันทึกห้องเรียนแล้ว');
  }}]);
}

/* ---------- export / line ---------- */
function xlsxOK(){if(window.XLSX)return true;toast('โหลดไลบรารี Excel ไม่สำเร็จ – ตรวจสอบอินเทอร์เน็ต');return false}
function safeName(s){return String(s).replace(/[\\/:*?"<>|]/g,'-')}
function exportAsg(){
  if(!xlsxOK())return;const a=asg(),s=subj(),c=cls();
  const rows=[[`รายงานการส่งงาน: ${a.title}`],[`วิชา ${s.name} ${s.code||''} ห้อง ${c.name}  กำหนดส่ง ${thDate(a.due,true)}`],[],['เลขที่','เลขประจำตัว','ชื่อ-สกุล','สถานะ','เวลาบันทึก','เหตุผล/หมายเหตุ']];
  students().forEach(st=>{const r=a.records[st.id]||{};rows.push([st.no,st.code,fullName(st),r.s?ST[r.s].label:'ยังไม่ตรวจ',r.t?new Date(r.t).toLocaleString('th-TH'):'',r.r||''])});
  const k=counts(a);rows.push([],['สรุป'],['ส่งแล้ว',k.sent],['ส่งช้า',k.late],['ยกเว้น',k.excused],['ไม่ส่ง',k.missing],['ยังไม่ตรวจ',k.none],['อัตราการส่ง',rate(k)+'%']);
  const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:7},{wch:13},{wch:28},{wch:12},{wch:20},{wch:30}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'การส่งงาน');
  XLSX.writeFile(wb,safeName(`ส่งงาน_${c.name}_${s.name}_${a.title}.xlsx`));
}
function shareLine(){
  const a=asg(),s=subj(),c=cls(),k=counts(a);
  const miss=students().filter(st=>{const x=a.records[st.id]?.s;return x==='missing'||!x});

function autoClose(){try{return localStorage.getItem('hw_autoclose')!=='0'}catch(e){return true}}
function scheduleAutoClose(){if(!$('#autoClose')?.checked)return;clearTimeout(acT);const ls=$('#lastScan');if(ls)ls.insertAdjacentHTML('beforeend','<div class="sm mut" style="font-weight:500">กำลังปิด…</div>');acT=setTimeout(()=>{if($('#ov')&&$('#qr-reader')){closeModal();renderCheck()}},1100)}

function stopScanner(){clearTimeout(acT);if(scanner){const s=scanner;scanner=null;s.stop().then(()=>s.clear()).catch(()=>{})}}
function handleScan(txt){
  txt=String(txt||'').trim();if(!txt)return;
  const now=Date.now();if(lastScan[txt]&&now-lastScan[txt]<2500)return;lastScan[txt]=now;
  const st=findScanned(txt),code=st?st.code:txt.split(/\r?\n/)[0].slice(0,30);
  const log=$('#scanlog');
  if(!st){beep(false);log&&log.insertAdjacentHTML('afterbegin',`<div class="c-r">❌ ไม่พบรหัส "${esc(code)}" ในห้องนี้</div>`);return}
  const a=asg(),prev=a.records[st.id]?.s;
  const ls=$('#lastScan');
  if(prev==='sent'){beep(true);ls&&(ls.innerHTML=`<span style="color:var(--y)">✓ ${esc(fullName(st))} ส่งแล้ว</span>`);log&&log.insertAdjacentHTML('afterbegin',`<div class="c-y">ℹ️ ${st.no}. ${esc(fullName(st))} – สถานะเป็น "ส่ง" อยู่แล้ว</div>`);scheduleAutoClose();return}
  setSt(st.id,'sent',true);beep(true);scanN++;const sc=$('#scanCount');if(sc)sc.textContent=`สแกนแล้ว ${scanN} คน`;setTimeout(scheduleAutoClose,0);
  ls&&(ls.innerHTML=`<span style="color:var(--g)">✅ ${st.no}. ${esc(fullName(st))}</span>`);
  log&&log.insertAdjacentHTML('afterbegin',`<div class="c-g">✅ ${st.no}. ${esc(fullName(st))} – เปลี่ยนเป็น "ส่ง"${prev?` (เดิม: ${ST[prev].label})`:''} · ${thTime(now)}</div>`);
}
function beep(ok){try{const A=new(window.AudioContext||window.webkitAudioContext)();const o=A.createOscillator(),g=A.createGain();o.frequency.value=ok?1046:220;g.gain.value=.12;o.connect(g);g.connect(A.destination);o.start();setTimeout(()=>{o.stop();A.close()},ok?130:320)}catch(e){}if(navigator.vibrate)navigator.vibrate(ok?60:[80,60,80])}

function downloadTemplate(){

const PREFIXES=['เด็กชาย','เด็กหญิง','ด.ช.','ด.ญ.','นางสาว','น.ส.','นาย','นาง'];
function splitPrefix(n){n=String(n||'').trim();for(const p of PREFIXES)if(n.startsWith(p)){let pre=p==='เด็กชาย'?'ด.ช.':p==='เด็กหญิง'?'ด.ญ.':p;return[pre,n.slice(p.length).trim()]}return['',n]}
function importExcel(file){
  if(!xlsxOK())return;
  const fr=new FileReader();
  fr.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}).map(r=>r.map(x=>String(x).trim()));
      const parsed=parseRows(rows);
      if(!parsed.length)return toast('ไม่พบรายชื่อในไฟล์');
      previewImport(parsed);
    }catch(err){console.error(err);toast('อ่านไฟล์ไม่สำเร็จ')}
  };
  fr.readAsArrayBuffer(file);
}
function parseRows(rows){
  let hi=rows.findIndex(r=>r.some(c=>/ชื่อ|name/i.test(c)));
  const col={no:-1,code:-1,pre:-1,first:-1,last:-1,full:-1};
  if(hi>=0){
    rows[hi].forEach((h,i)=>{const t=h.replace(/\s/g,'').toLowerCase();
      if(col.no<0&&/^(เลขที่|ที่|no\.?|ลำดับ)$/.test(t))col.no=i;
      else if(col.code<0&&/(เลขประจำตัว|รหัส|^id$|studentid|code)/.test(t))col.code=i;
      else if(col.pre<0&&/(คำนำหน้า|prefix|title)/.test(t))col.pre=i;
      else if(col.full<0&&/(ชื่อ-?สกุล|ชื่อ-?นามสกุล|fullname)/.test(t))col.full=i;
      else if(col.last<0&&/(นามสกุล|สกุล|lastname|surname)/.test(t))col.last=i;
      else if(col.first<0&&/(^ชื่อ$|firstname|^name$|ชื่อนักเรียน)/.test(t))col.first=i;
    });
    if(col.first<0&&col.full<0){const i=rows[hi].findIndex(h=>/ชื่อ/.test(h));col.full=i}
  }else{hi=-1;col.no=0;col.code=1;col.full=2}
  const out=[];
  rows.slice(hi+1).forEach((r,idx)=>{
    let pre=col.pre>=0?r[col.pre]:'',first=col.first>=0?r[col.first]:'',last=col.last>=0?r[col.last]:'';
    if(col.full>=0&&r[col.full]){const parts=r[col.full].split(/\s+/);const [p,f]=splitPrefix(parts[0]);if(!pre)pre=p;if(f===''&&parts.length>2){first=parts[1];last=parts.slice(2).join(' ')}else{first=f||parts[0];if(!pre&&p)pre=p;last=parts.slice(1).join(' ')}}
    if(!pre&&first){const [p,f]=splitPrefix(first);if(p){pre=p;first=f}}
    if(!first)return;
    out.push({no:+(col.no>=0?r[col.no]:'')||idx+1,code:col.code>=0?r[col.code]:'',prefix:pre,first,last});
  });
  return out;
}

/* QR content: readable on any phone camera + parsable by the in-app scanner */
function qrText(s,c){return `เลขประจำตัว: ${s.code}\nเลขที่: ${s.no}\nชื่อ: ${fullName(s)}\nห้อง: ${c?c.name:''}`}
function findScanned(txt){
  const list=cls().students;txt=String(txt||'').trim();
  const plain=txt.replace(/^HW[:\-]?/i,'');
  let st=list.find(s=>String(s.code)===plain||s.id===plain);if(st)return st;
  const m=txt.match(/เลขประจำตัว\s*[:：]\s*([^\s\n]+)/);
  if(m&&(st=list.find(s=>String(s.code)===m[1])))return st;
  const toks=new Set(txt.split(/[^0-9A-Za-z_\-]+/).filter(Boolean));
  return list.find(s=>toks.has(String(s.code)))||null;
}
function qrSVG(text,cell=5){if(!window.qrcode)return '<p>โหลด QR ไม่สำเร็จ</p>';const q=qrcode(0,'M');q.addData(unescape(encodeURIComponent(String(text))),'Byte');q.make();return q.createSvgTag({cellSize:cell,margin:2})}

}
const QR_CSS=`.qg{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}
.qc{border:1.5px dashed #8a8fb0;border-radius:10px;padding:3mm 3mm 4mm;text-align:center;page-break-inside:avoid;break-inside:avoid;font-family:'Noto Sans Thai',sans-serif;background:#fff}

function showQR(id){const c=cls(),s=c.students.find(x=>x.id===id);modal('QR ของนักเรียน',`<style>${QR_CSS}.md .qc{max-width:260px;margin:10px auto}.md .qq svg{width:190px;height:190px}</style>${qrCardHTML(s,c)}`,[{label:'ปิด'},{label:'🖨 พิมพ์บัตรนี้',cls:'pri',onClick:()=>printQR([id])}])}
function printQR(ids){

let repSub=null,rep={mode:'all',from:'',to:''};
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function rangeOf(){const t=todayISO();
  if(rep.mode==='today')return[t,t];
  if(rep.mode==='month'){const m=t.slice(0,7);return[m+'-01',m+'-31']}
  if(rep.mode==='custom')return[rep.from||'0000-00-00',rep.to||'9999-12-31'];
  return null}
function rangeLabel(){const t=todayISO();
  if(rep.mode==='today')return 'วันนี้ ('+thDate(t)+')';
  if(rep.mode==='month')return 'เดือนนี้ ('+TH_M[+t.slice(5,7)-1]+' '+(+t.slice(0,4)+543)+')';
  if(rep.mode==='custom')return (rep.from?thDate(rep.from):'เริ่มต้น')+' – '+(rep.to?thDate(rep.to):'ปัจจุบัน');
  return 'ทั้งหมด'}
function repData(){
  const c=cls(),r=rangeOf(),st=students();
  const subs=repSub==='__all'?c.subjects:c.subjects.filter(s=>s.id===repSub);
  const A=subs.flatMap(s=>s.assignments.map(a=>({a,s})))
    .filter(({a})=>!r||((a.due||'')>=r[0]&&(a.due||'')<=r[1]))
    .sort((x,y)=>(x.a.due||'').localeCompare(y.a.due||'')||x.s.name.localeCompare(y.s.name));
  const tot={sent:0,late:0,excused:0,missing:0,none:0};
  const rows=st.map(x=>{const k={sent:0,late:0,excused:0,missing:0,none:0};const pend=[];
    A.forEach(({a,s})=>{const rr=a.records[x.id]||{};k[rr.s||'none']++;tot[rr.s||'none']++;if(rr.s==='missing'||(!rr.s&&isOver(a)))pend.push({a,s,r:rr.r||''})});
    return{x,k,pend}});
  const subName=repSub==='__all'?'ทุกวิชา':'วิชา'+(subs[0]?.name||'');
  return{c,subs,A,st,rows,tot,subName,all:repSub==='__all'};
}

const SKEY='homeworkcheck_sync';
var sync=(()=>{try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return{}}})();
if(sync.auto===undefined)sync.auto=true;
function saveSync(){try{localStorage.setItem(SKEY,JSON.stringify(sync))}catch(e){}}
let syncBusy=false,syncAgain=false,syncT=null;
function updateInd(state){
  const el=$('#saveInd');if(!el)return;

function scheduleSync(){if(!sync.auto)return;clearTimeout(syncT);syncT=setTimeout(()=>pushAll({silent:true}),3000)}
function genKey(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';let s='hw_';for(let i=0;i<16;i++)s+=ch[Math.floor(Math.random()*ch.length)];return s}
async function api(action,extra,cfg){
  const url=(cfg||sync).url,key=(cfg||sync).key;
  if(!url||!/^https:\/\/script\.google(usercontent)?\.com\//.test(url))throw new Error('URL เว็บแอปไม่ถูกต้อง (ต้องขึ้นต้นด้วย https://script.google.com/macros/s/…/exec)');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);
  let res;
  try{res=await fetch(url,{method:'POST',body:JSON.stringify(Object.assign({key,action},extra||{})),headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctl.signal,redirect:'follow'})}
  catch(e){throw new Error(e.name==='AbortError'?'หมดเวลาเชื่อมต่อ':'เชื่อมต่อไม่ได้ – ตรวจ URL, อินเทอร์เน็ต และการตั้งค่า "ผู้มีสิทธิ์เข้าถึง: ทุกคน"')}
  finally{clearTimeout(to)}
  const txt=await res.text();let j;
  try{j=JSON.parse(txt)}catch(e){throw new Error('เซิร์ฟเวอร์ไม่ได้ตอบเป็น JSON – อาจยังไม่ได้ Deploy เวอร์ชันใหม่ หรือสิทธิ์ไม่ใช่ "ทุกคน"')}
  if(!j.ok){const er=new Error(j.error||'ผิดพลาด');er.conflict=!!j.conflict;er.remoteAt=j.updatedAt;throw er}
  return j;
}
function cellSafe(v){v=v==null?'':v;return typeof v==='string'&&/^[=+\-@]/.test(v)?"'"+v:v}
function buildTables(){
  const S=[['ห้อง','เลขที่','เลขประจำตัว','คำนำหน้า','ชื่อ','นามสกุล']];
  const W=[['ห้อง','วิชา','รหัสวิชา','ครูผู้สอน','งาน','กำหนดส่ง','ส่งแล้ว','ส่งช้า','ยกเว้น','ไม่ส่ง','ยังไม่ตรวจ','อัตราการส่ง (%)']];
  const R=[['ห้อง','วิชา','งาน','กำหนดส่ง','เลขที่','เลขประจำตัว','ชื่อ-สกุล','สถานะ','เวลาบันทึก','เหตุผล/หมายเหตุ']];
  db.classes.forEach(c=>{
    const st=c.students.slice().sort((a,b)=>(a.no||0)-(b.no||0));
    st.forEach(s=>S.push([c.name,s.no,s.code,s.prefix,s.first,s.last]));
    c.subjects.forEach(sb=>sb.assignments.forEach(a=>{
      const k=counts(a,st);W.push([c.name,sb.name,sb.code||'',sb.teacher||'',a.title,a.due||'',k.sent,k.late,k.excused,k.missing,k.none,rate(k)]);
      st.forEach(s=>{const r=a.records[s.id]||{};R.push([c.name,sb.name,a.title,a.due||'',s.no,s.code,fullName(s),r.s?ST[r.s].label:'ยังไม่ตรวจ',r.t?new Date(r.t).toLocaleString('th-TH'):'',r.r||''])});
    }));
  });
  const f=t=>t.map(r=>r.map(cellSafe));
  return{'นักเรียน':f(S),'สรุปงาน':f(W),'การส่งงาน':f(R)};
}
async function pushAll(o={}){
  if(!sync.connected&&!o.force)return;
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;updateInd('busy');const sentPending=sync.pending||0;
  try{
    const j=await api('push',{data:db,tables:buildTables(),baseAt:sync.remoteAt||'',force:!!o.force});
    sync.pending=Math.max(0,(sync.pending||0)-sentPending);sync.lastSync=Date.now();sync.remoteAt=j.updatedAt;sync.lastError='';
    if(j.name)sync.sheetName=j.name;
    if(!o.silent)toast('☁️ ส่งข้อมูลขึ้น Google Sheets แล้ว');
  }catch(e){
    sync.lastError=e.message;
    if(e.conflict)conflictModal();
    else if(!o.silent)toast('⚠️ '+e.message);
  }finally{
    syncBusy=false;saveSync();updateInd();if(tab==='sheets')renderSheets();
    if(syncAgain){syncAgain=false;if(sync.pending)scheduleSync()}
  }
}
async function pullAll(o={}){
  syncBusy=true;updateInd('busy');
  try{
    const j=await api('pull');
    if(!j.data||!Array.isArray(j.data.classes)){if(!o.silent)toast('ในชีตยังไม่มีข้อมูล');return false}
    db=j.data;db.settings=db.settings||{};db.cur=db.cur||{};
    sync.pending=0;sync.lastSync=Date.now();sync.remoteAt=j.updatedAt;sync.lastError='';
    save(true);render();if(!o.silent)toast('⬇ ดึงข้อมูลจาก Google Sheets แล้ว');
    return true;
  }catch(e){sync.lastError=e.message;if(!o.silent)toast('⚠️ '+e.message);return false}
  finally{syncBusy=false;saveSync();updateInd();if(tab==='sheets')renderSheets()}
}
async function smartSync(o={}){
  if(!sync.connected)return;
  try{
    updateInd('busy');
    const j=await api('ping');
    sync.sheetName=j.name;sync.sheetUrl=j.url;
    const remoteChanged=j.updatedAt&&j.updatedAt!==sync.remoteAt;
    if(remoteChanged&&sync.pending){conflictModal();return}
    if(remoteChanged){await pullAll(o);return}
    if(sync.pending){await pushAll(o);return}
    sync.lastSync=Date.now();sync.lastError='';if(!o.silent)toast('✅ ข้อมูลเป็นปัจจุบันแล้ว');
  }catch(e){sync.lastError=e.message;if(!o.silent)toast('⚠️ '+e.message)}
  finally{saveSync();updateInd();if(tab==='sheets')renderSheets()}
}

function disconnectSheets(){confirmBox('ยกเลิกการเชื่อมต่อ Google Sheets? (ข้อมูลในเครื่องและในชีตยังอยู่ครบ)',()=>{sync.connected=false;sync.pending=0;sync.lastError='';saveSync();updateInd();renderSheets();toast('ยกเลิกการเชื่อมต่อแล้ว')},'ยกเลิกการเชื่อมต่อ')}
function gsCode(key){return GS_CODE.replace('__KEY__',String(key||'').replace(/['\\]/g,''))}
const GS_CODE=String.raw`/**
 * HomeworkCheck — Google Sheets API
 * วิธีใช้: เปิด Google Sheets > ส่วนขยาย > Apps Script > วางโค้ดนี้ทั้งหมด > บันทึก
 *        แล้ว Deploy เป็น "เว็บแอป" (ดำเนินการในฐานะ: ฉัน / ผู้มีสิทธิ์เข้าถึง: ทุกคน)
 */
const API_KEY = '__KEY__';   // ต้องตรงกับ "รหัสลับ" ในหน้าเว็บ HomeworkCheck
const DATA_SHEET = '_hwdata'; // ชีตเก็บข้อมูลดิบ (ซ่อนไว้ อย่าแก้ไข)

function doGet(e) {
  var p = (e && e.parameter) || {};
  if (!p.action) return out_({ ok: true, message: 'HomeworkCheck API พร้อมใช้งาน ✅', hasKey: API_KEY.length > 0 });
  return handle_(p);
}
function doPost(e) {
  var p = {};
  try { p = JSON.parse(e.postData.contents); } catch (err) {}
  return handle_(p);
}
function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
function handle_(p) {
  if (!API_KEY) return out_({ ok: false, error: 'ยังไม่ได้ตั้งรหัสลับ (API_KEY) ในโค้ด Apps Script' });
  if (!p.key || p.key !== API_KEY) return out_({ ok: false, error: 'รหัสลับไม่ถูกต้อง' });
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try {
    var meta = getMeta_(ss);
    if (p.action === 'ping') return out_({ ok: true, name: ss.getName(), url: ss.getUrl(), updatedAt: meta });
    if (p.action === 'pull') return out_({ ok: true, data: readData_(ss), updatedAt: meta });
    if (p.action === 'push') {
      if (!p.force && meta && p.baseAt !== meta)
        return out_({ ok: false, conflict: true, updatedAt: meta, error: 'ข้อมูลในชีตถูกแก้ไขจากเครื่องอื่น' });
      var at = new Date().toISOString();
      writeData_(ss, p.data, at);
      var t = p.tables || {};
      Object.keys(t).forEach(function (name) { writeTable_(ss, name, t[name]); });
      return out_({ ok: true, updatedAt: at, name: ss.getName() });
    }
    return out_({ ok: false, error: 'ไม่รู้จักคำสั่ง ' + p.action });
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}
function getMeta_(ss) {
  var sh = ss.getSheetByName(DATA_SHEET);
  return sh ? String(sh.getRange(1, 1).getDisplayValue() || '') : '';
}
function readData_(ss) {
  var sh = ss.getSheetByName(DATA_SHEET);
  if (!sh || sh.getLastRow() < 2) return null;
  var v = sh.getRange(2, 1, sh.getLastRow() - 1, 1).getValues();
  return JSON.parse(v.map(function (r) { return String(r[0]).substring(1); }).join(''));
}
function writeData_(ss, data, at) {
  var sh = ss.getSheetByName(DATA_SHEET);
  if (!sh) { sh = ss.insertSheet(DATA_SHEET); sh.hideSheet(); }
  var s = JSON.stringify(data), rows = [];
  for (var i = 0; i < s.length; i += 40000) rows.push(['x' + s.substring(i, i + 40000)]);
  sh.clear();
  sh.getRange(1, 1).setNumberFormat('@').setValue(at);
  if (rows.length) sh.getRange(2, 1, rows.length, 1).setNumberFormat('@').setValues(rows);
}
function writeTable_(ss, name, rows) {
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  sh.clear();
  if (!rows || !rows.length) return;
  var w = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
  var vals = rows.map(function (r) {
    var a = r.slice(); while (a.length < w) a.push('');
    return a.map(function (x) { return x == null ? '' : x; });
  });
  sh.getRange(1, 1, vals.length, w).setNumberFormat('@').setValues(vals);
  sh.getRange(1, 1, 1, w).setFontWeight('bold').setBackground('#e8e6ff');
  sh.setFrozenRows(1);
  sh.autoResizeColumns(1, w);
}
`;
function copyCode(){const v=$('#gsCode').textContent;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('คัดลอกโค้ดแล้ว')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#gsCode'));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');toast('คัดลอกโค้ดแล้ว')})}
function renderSheets(){

            <li>ใช้ URL ที่ลงท้าย <code>/exec</code> เท่านั้น (URL <code>/dev</code> ใช้ได้เฉพาะเจ้าของที่ล็อกอินอยู่)</li>
            <li>ทดสอบในหน้าต่างไม่ระบุตัวตน หรือรีเฟรชหน้านี้ (Ctrl+F5) แล้วลองใหม่</li>
          </ol>
        </div>
      </details>
      <details>
        <summary>📄 ขึ้น "ขออภัย ไม่สามารถเปิดไฟล์ได้ในขณะนี้"</summary>

          <ul>
            <li>มักเกิดตอน<b>ล็อกอิน Google หลายบัญชีพร้อมกัน</b>ในเบราว์เซอร์เดียว → เปิด URL ในหน้าต่างไม่ระบุตัวตน หรือออกจากระบบบัญชีอื่นก่อน</li>
            <li>ตรวจว่า URL ไม่มี <code>/u/0/</code> หรือ <code>/u/1/</code> อยู่ข้างใน ถ้ามีให้ลบส่วนนั้นออก ให้เหลือรูปแบบ <code>https://script.google.com/macros/s/…/exec</code></li>
            <li>URL อาจคัดลอกไม่ครบ → กลับไปคัดลอกจาก จัดการการทำให้ใช้งานได้ → ช่อง <b>เว็บแอป URL</b> ใหม่</li>
            <li>ถ้า Deploy ถูกเก็บถาวร (Archive) หรือลบไปแล้ว URL นั้นจะใช้ไม่ได้ → Deploy ใหม่แล้วใช้ URL ใหม่</li>
          </ul>
        </div>
      </details>

            <li>ถ้าข้อมูลเยอะมาก (หลายห้อง หลายร้อยงาน) ให้ปิด "ซิงก์อัตโนมัติ" ระหว่างเช็ค แล้วกดซิงก์ตอนเช็คเสร็จครั้งเดียว</li>
